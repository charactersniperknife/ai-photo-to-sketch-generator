[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ai-photo-to-sketch-generator"
version = "0.4.2"
description = "Turn ordinary photos into clean pencil, ink, and charcoal sketches on Windows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SketchForge Maintainers" },
]
keywords = ["sketch", "photo", "edge-detection", "pencil", "opencv", "torch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

dependencies = [
    "numpy>=1.26,<2.1",
    "opencv-python-headless>=4.9,<5.0",
    "Pillow>=10.2,<11.0",
    "pydantic>=2.6,<3.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.3,<3.0",
    "torchvision>=0.18,<1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "black>=24.3",
    "isort>=5.13",
    "pre-commit>=3.7",
]

[project.scripts]
sketchforge = "sketchforge.cli.__main__:app"

[project.urls]
Homepage = "https://github.com/sketchforge/ai-photo-to-sketch-generator"
Issues = "https://github.com/sketchforge/ai-photo-to-sketch-generator/issues"

[tool.hatch.build.targets.wheel]
packages = ["sketchforge"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=sketchforge --cov-report=term-missing"